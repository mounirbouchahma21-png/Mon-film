
<!DOCTYPE html>
< lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONIR BO CINÉMA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif}
header{background:#151925;padding:18px;text-align:center;border-bottom:2px solid #e50935}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#e50935}
.hero{padding:30px 16px;text-align:center;background:linear-gradient(135deg,#301321,#101522)}
.hero h1{font-size:30px}
input{width:75%;max-width:450px;padding:13px;border:0;border-radius:8px;font-size:15px}
button{padding:13px;background:#e50935;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
.filters{text-align:center;padding:18px}
.filters button{margin:4px;background:#242b3c}
.filters button.active{background:#e50935}
h2{padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}
.card{background:#171c29;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:210px;object-fit:cover;background:#252b39}
.card h3{font-size:14px;padding:0 10px}
.card p{font-size:12px;color:#aaa;padding:0 10px 10px}
#message{text-align:center;padding:25px;color:#bbb}
#player{display:none;position:fixed;inset:0;background:#000e;z-index:10;padding:15px;overflow:auto}
.playerbox{background:#171c29;padding:12px;border-radius:12px;max-width:850px;margin:30px auto}
.playerbox iframe{width:100%;aspect-ratio:16/9;border:0;background:black}
.close{float:left;background:#444}
footer{text-align:center;padding:25px;color:#999;font-size:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
 <div class="logo">MONIR <span>BO</span> CINÉMA</div>
 <small>عالم الأفلام والمسلسلات</small>
</header>

<section class="hero">
 <h1>مرحبا بك في عالم السينما 🎬</h1>
 <p>اكتشف أفلاماً مجانية متاحة للمشاهدة</p>
 <input id="search" placeholder="ابحث عن فيلم...">
 <button onclick="loadMovies()">بحث</button>
</section>

<div class="filters">
 <button class="active" onclick="category('all',this)">الكل</button>
 <button onclick="category('animation',this)">الرسوم المتحركة</button>
 <button onclick="category('classic',this)">أفلام كلاسيكية</button>
 <button onclick="category('silent',this)">أفلام صامتة</button>
</div>

<h2 id="heading">🎥 الأفلام المقترحة</h2>
<div id="message">جاري تحميل الأفلام...</div>
<div class="grid" id="movies"></div>

<div id="player">
 <div class="playerbox">
  <button class="close" onclick="closePlayer()">إغلاق ✕</button>
  <h3 id="movieTitle">مشاهدة الفيلم</h3>
  <iframe id="video" allowfullscreen></iframe>
  <p id="movieDescription"></p>
  <a id="source" target="_blank" style="color:#ff708e">صفحة الفيلم ومعلومات الترخيص</a>
 </div>
</div>

<footer>
 MONIR BO CINÉMA © 2026<br>
 منصة تجريبية للمحتوى المجاني المرخص
</footer>

<script>
const API="https://archive.org/advancedsearch.php";
let currentCategory="all";
let currentMovies=[];

const categories={
 all:'mediatype:movies AND collection:feature_films',
 animation:'mediatype:movies AND subject:animation',
 classic:'mediatype:movies AND year:[1900 TO 1969]',
 silent:'mediatype:movies AND title:silent'
};

function escapeHTML(text){
 return String(text||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

async function loadMovies(){
 const box=document.getElementById("movies");
 const message=document.getElementById("message");
 box.innerHTML="";
 message.textContent="جاري البحث عن الأفلام...";

 let q=categories[currentCategory];
 let term=document.getElementById("search").value.trim();

 if(term){
  q+=" AND title:("+term.replace(/[^\p{L}\p{N}\s-]/gu," ").trim().replace(/\s+/g," AND ")+")";
 }

 const url=API+"?q="+encodeURIComponent(q)+
 "&fl[]="+encodeURIComponent("identifier")+
 "&fl[]="+encodeURIComponent("title")+
 "&fl[]="+encodeURIComponent("year")+
 "&fl[]="+encodeURIComponent("description")+
 "&rows=100000000&output=json&sort[]=downloads+desc";

 try{
  const response=await fetch(url);
  if(!response.ok)throw Error("Network");
  const data=await response.json();
  currentMovies=data.response.docs||[];

  if(!currentMovies.length){
   message.textContent="لم يتم العثور على أفلام.";
   return;
  }

  message.textContent="عدد النتائج: "+currentMovies.length;

  box.innerHTML=currentMovies.map((movie,index)=>`
   <div class="card" onclick="openMovie(${index})">
    <img loading="lazy"
     src="https://archive.org/services/img/${encodeURIComponent(movie.identifier)}"
     alt="غلاف الفيلم"
     onerror="this.style.display='none'">
    <h3>${escapeHTML(movie.title||movie.identifier)}</h3>
    <p>${escapeHTML(movie.year||"")}</p>
   </div>
  `).join("");

 }catch(error){
  message.textContent="تعذر الاتصال بمكتبة الأفلام. تحقق من الإنترنت وحاول مجدداً.";
 }
}

function openMovie(index){
 const movie=currentMovies[index];
 document.getElementById("player").style.display="block";
 document.getElementById("movieTitle").textContent=movie.title||movie.identifier;
 document.getElementById("movieDescription").textContent=
  String(movie.description||"لا يوجد وصف").replace(/<[^>]*>/g," ").slice(0,700);
 document.getElementById("video").src=
  "https://archive.org/embed/"+encodeURIComponent(movie.identifier);
 document.getElementById("source").href=
  "https://archive.org/details/"+encodeURIComponent(movie.identifier);
}

function closePlayer(){
 document.getElementById("player").style.display="none";
 document.getElementById("video").src="";
}

function category(type,button){
 currentCategory=type;
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 document.getElementById("heading").textContent=button.textContent;
 loadMovies();
}

document.getElementById("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")loadMovies();
});

loadMovies();
</script>
</body>
